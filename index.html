<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="imageback">
            <img class="image" src="plant-image.avif" />
            <div class="bannercontainer">
                <div class="banner">
                    <img class="bannerimage" src="odin-lined.png"/>
                    <p class="bannertext">Odin</p>
                </div>
            </div>
            <div class="footer">
                Photo by&nbsp;<a id="author" href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA">Hallie West</a>
            </div>
        </div>
        <div class="signup">
            <div class="section">
                <div class="textsection">
                    <p class="signuptext">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
                        <br>
                    <p class="signuptext">You <em>know</em> you want to.</p>
                </div>
            </div>
            <div class="formsection">
                <form>
                    <h1 class="letsdothis">Let's do this</h1>
                    <table>
                        <tr>
                            <td>
                                <div class="inputcombo">
                                    <label class="formlabel" for="first_name">FIRST NAME</label>
                                    <input type="text" id="first_name">
                                </div>
                            </td>
                            <td>
                                <div class="inputcombo">
                                    <label class="formlabel" for="last_name">LAST NAME</label>
                                    <input class="forminput" type="text" id="last_name">
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="inputcombo">
                                    <label class="formlabel" for="last_name">EMAIL</label>
                                    <input class="forminput" type="email" id="email">
                                </div>
                            </td>
                            <td>
                                <div class="inputcombo">
                                    <label class="formlabel" for="last_name">PHONE NUMBER</label>
                                    <input class="forminput" type="tel" id="phone_number">
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="inputcombo">
                                    <label class="formlabel" for="last_name">PASSWORD</label>
                                    <input class="forminput" type="text" id="password">
                                </div>
                            </td>
                            <td>
                                <div class="inputcombo">
                                    <label class="formlabel" for="last_name">CONFIRM PASSWORD</label>
                                    <input class="forminput" type="text" id="confirm_password">
                                </div>
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
            <div class="section">
                <div class="innersection">
                    <button class="createaccount">Create Account</button>
                    <p class="loginbanner">Already have an account? <a id="logintext" href="#">Log in</a></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
